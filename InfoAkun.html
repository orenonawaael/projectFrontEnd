<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Akun - Furry.id</title>
    <link rel="stylesheet" href="../style/InformasiAkun.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-furry">
                <img src="../image/Furry.id Logo Horizontal Berwarna.png" alt="Furry.id Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active">
                        <a href="#">
                            <i class="fa-solid fa-user"></i>
                            Informasi Akun
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            Riwayat Aktivitas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#">
                            <i class="fa-solid fa-shield-halved"></i>
                            Keamanan Akun
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-logout">
                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Keluar
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="account-info-card">
                <h2>Informasi Akun</h2>
                <div class="account-profile">
                    <div class="profile-picture">
                        <img src="../image/profil.jpg" alt="Foto Profil">
                    </div>
                    <div class="profile-details">
                        <div class="form-group">
                            <label for="nama">Nama</label>
                            <input type="text" id="nama" value="Cepot Jamet">
                        </div>
                        <div class="form-group">
                            <label for="alamat">Alamat</label>
                            <input type="text" id="alamat" value="Semarang">
                        </div>
                        <div class="form-group">
                            <label for="email">No.Hp/Email</label>
                            <input type="email" id="email" value="cepotjamet@gmail.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" value="********">
                        </div>
                        <button class="btn-save">Simpan</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
