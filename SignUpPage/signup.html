<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Furry.id</title>
    <link rel="stylesheet" href="StyleSignUp.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <img src="../image/Furry.id Logo Horizontal Berwarna.png" alt="Furry.id Logo">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="../LandingPage/landingpage.html">Home</a></li>
                    <li><a href="../LandingPage/landingpage.html#adopsi">Hewan Adopsi</a></li>
                    <li><a href="../LandingPage/landingpage.html#about">Tentang Kami</a></li>
                    <li><a href="../LandingPage/landingpage.html#footer-contact">Kontak</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="../SignUpPage/signup.html" class="btn btn-primary-outline">Sign Up</a>
                <a href="../SignInPage/signin.html" class="btn btn-primary-filled">Sign In</a>
            </div>
        </div>
    </header>
    
    <div class="form-container">
        <div class="glass-form">
            <h2 class="form-title">Bergabunglah bersama Furry.id</h2>
            <p class="form-subtitle">Buat akun Anda untuk memulai perjalanan adopsi hewan peliharaan Anda!</p>
            <form action="#" method="POST" class="signup-form">
                <div class="input-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="input-group">
                    <label for="identifier">No. Telp atau Alamat E-mail</label>
                    <input type="textr" id="identifier" name="identifier" placeholder="Masukkan No. Telp atau Alamat E-mail Anda" required>
                </div>
                <!-- <div class="input-group">
                    <label for="notelp">No.Telp</label>
                    <input type="text" id="notelp" name="notelp" placeholder="Masukkan No. Telepon Anda" required>
                </div> -->
                <div class="input-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" placeholder="Buat kata sandi" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Konfirmasi kata sandi" required>
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Saya setuju dengan <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a></label>
                </div>
                <button type="submit" class="submit-btn">Signt Up</button>
            </form>
            <div class="divider">
                <span>Atau Sign Up dengan</span>
            </div>
            <div class="social-login">
                <button class="social-btn google"><i class="fab fa-google"></i> Google</button>
                <button class="social-btn facebook"><i class="fab fa-facebook"></i> Facebook</button>
            </div>
            <p class="signin-link">
                Sudah punya akun? <a href="../SignInPage/signin.html">Masuk di sini</a>
            </p>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy;2025 Furry.id | All Rights Reserved</p>
    </div>
<script>
    // Example of simple form validation
    document.querySelector('.signup-form').addEventListener('submit', function(event) {
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm-password').value;
        if (password !== confirmPassword) {
            alert('Kata sandi dan konfirmasi kata sandi tidak sesuai.');
            event.preventDefault();
        }
    });
    // Toggle password visibility
    var passwordField = document.getElementById('password');
    var togglePassword = document.getElementById('toggle-password');
    togglePassword.addEventListener('click', function() {
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            togglePassword.classList.remove('fa-eye');
            togglePassword.classList.add('fa-eye-slash');
        } else {
            passwordField.type = 'password';
            togglePassword.classList.remove('fa-eye-slash');
            togglePassword.classList.add('fa-eye');
        }
    });

    // Toggle confirm password visibility
    var confirmPasswordField = document.getElementById('confirm-password');
    var toggleConfirmPassword = document.getElementById('toggle-confirm-password');
    toggleConfirmPassword.addEventListener('click', function() {
        if (confirmPasswordField.type === 'password') {
            confirmPasswordField.type = 'text';
            toggleConfirmPassword.classList.remove('fa-eye');
            toggleConfirmPassword.classList.add('fa-eye-slash');
        } else {
            confirmPasswordField.type = 'password';
            toggleConfirmPassword.classList.remove('fa-eye-slash');
            toggleConfirmPassword.classList.add('fa-eye');
        }
    });
</script>
</body>
</html>
