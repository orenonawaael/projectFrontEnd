<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Scroll Smooth</title>
  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 60px;
    }
    body { margin:0; }
    header {
      position: sticky;
      top: 0;
      height: 60px;
      background: navy;
      color: white;
    }
    section {
      height: 100vh;
      padding: 20px;
    }
    #satu { background: lightblue; }
    #dua { background: lightgreen; }
  </style>
</head>
<body>
  <header>
    <a href="#satu">Satu</a> |
    <a href="#dua">Dua</a>
  </header>
  <section id="satu">Section 1</section>
  <section id="dua">Section 2</section>
</body>
</html>
