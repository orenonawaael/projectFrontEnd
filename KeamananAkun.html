<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keamanan Akun - Furry.id</title>
    <link rel="stylesheet" href="../style/KeamananAkun.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-furry">
                <img src="../image/Furry.id Logo Horizontal Berwarna.png" alt="Furry.id Logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="#">
                            <i class="fa-solid fa-user"></i>
                            Informasi Akun
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            Riwayat Aktivitas
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="#">
                            <i class="fa-solid fa-shield-halved"></i>
                            Keamanan Akun
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-logout">
                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Keluar
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="security-card">
                <h2 class="security-title">Keamanan Akun</h2>
                <p class="security-subtitle">Jaga keamanan akunmu dengan rutin mengganti kata sandi.</p>

                <div class="password-form">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-group">
                            <input type="password" id="password" value="********" readonly>
                            <button class="btn-edit-password">
                                <i class="fa-solid fa-pencil"></i> Edit Password
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
