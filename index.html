<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furry.id - Temukan Teman Berbulu Anda</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo">
                <img src="path/to/your/logo-furryid.png" alt="Furry.id Logo">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Layanan Kami</a></li>
                    <li><a href="#">Hewan Adopsi</a></li>
                    <li><a href="#">Tentang Kami</a></li>
                    <li><a href="#">Kontak</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="#" class="btn btn-primary-outline">Sign Up</a>
                <a href="#" class="btn btn-primary-filled">Sign In</a>
            </div>
        </div>
    </header>

    <section class="hero-new-design">
        <div class="container hero-new-content">
            <h1>Lorem Ipsum</h1>
            <div class="search-bar">
                <img src="pet-search-bar.jpg" alt="Hewan lucu" class="search-bar-img" style="height:40px; margin-right:10px;">
                <input type="text" placeholder="Silahkan cari hewan yang anda inginkan">
                <button class="search-btn">Cari</button>
            </div>
            <div class="cta-buttons">
                <a href="#" class="btn btn-cta">Adopsi Hewan</a>
                <a href="#" class="btn btn-cta">Adopsi Hewan</a>
            </div>
        </div>
        <div class="wave-shape">
            <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="#f8f8f8" fill-opacity="1" d="M0,192L48,176C96,160,192,128,288,106.7C384,85,480,75,576,90.7C672,107,768,149,864,165.3C960,181,1056,171,1152,154.7C1248,139,1344,117,1392,106.7L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
    </section>

    <section class="pet-categories-section">
        <div class="container categories-grid">
            <div class="category-card">
                <img src="path/to/your/kucing.jpg" alt="Kucing">
                <div class="category-name">Kucing</div>
            </div>
            <div class="category-card">
                <img src="path/to/your/anjing.jpg" alt="Anjing">
                <div class="category-name">Anjing</div>
            </div>
            <div class="category-card">
                <img src="path/to/your/burung.jpg" alt="Burung">
                <div class="category-name">Burung</div>
            </div>
            <div class="category-card">
                <img src="path/to/your/kura-kura.jpg" alt="Kura kura">
                <div class="category-name">Kura kura</div>
            </div>
            </div>
    </section>

</body>
</html>
